<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <!-- Content-Security-Policy: alleen eigen scripts, en verbindingen enkel
       naar ons Supabase-project. De Supabase-URL staat hier bewust vast: pas
       deze regel mee aan als het project ooit verhuist. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self';
    script-src 'self';
    style-src 'self' https://fonts.googleapis.com;
    font-src https://fonts.gstatic.com;
    img-src 'self';
    connect-src 'self' https://mbvvqdvsspersyjzuyqi.supabase.co wss://mbvvqdvsspersyjzuyqi.supabase.co;
    object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Beheer – 8-duust reservaties</title>
  <link rel="icon" type="image/webp" href="assets/duust-logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Inloggen: in één klik met Google, of anders met een code per e-mail. -->
  <section id="login-sectie" class="login-scherm">
    <div class="login-kaart">
      <img src="assets/duust-logo.webp" alt="8-duust">
      <h1>Beheer — inloggen</h1>
      <p>Alleen voor de organisatie.</p>
      <div id="fout-banner-login" class="banner banner-fout verborgen"></div>

      <!-- Google-inloggen staat standaard uit; beheer.js toont deze knop en de
           scheiding eronder alleen als googleInloggen in supabase-config.js
           aanstaat. Het Google-logo staat als inline SVG in de pagina: de CSP
           laat geen afbeeldingen van externe domeinen toe. -->
      <button type="button" id="google-knop" class="knop-google verborgen">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        Verder met Google
      </button>

      <div id="login-scheiding" class="login-scheiding verborgen"><span>of met e-mail</span></div>

      <!-- Stap 1: e-mailadres → code aanvragen. -->
      <form id="login-formulier" class="login-formulier">
        <label for="login-email">E-mailadres</label>
        <input type="email" id="login-email" required maxlength="200" autocomplete="email">
        <button type="submit" id="login-knop" class="knop-groen">Stuur inlogcode</button>
      </form>

      <!-- Stap 2: de code van 6 cijfers uit de mail. Werkt ook als de mail op
           een ander toestel binnenkomt dan waarop je wil inloggen. -->
      <form id="code-formulier" class="login-formulier verborgen">
        <label for="login-code">Inlogcode</label>
        <input type="text" id="login-code" required maxlength="6" inputmode="numeric"
               pattern="[0-9]{6}" autocomplete="one-time-code" class="code-invoer">
        <button type="submit" id="code-knop" class="knop-groen">Inloggen</button>
        <button type="button" id="ander-adres-knop" class="knop-tekst">Ander e-mailadres</button>
      </form>

      <p id="login-status" class="verborgen"></p>
    </div>
  </section>

  <!-- Portaal: pas zichtbaar na inloggen. -->
  <section id="portaal-sectie" class="verborgen">
    <header class="topbalk">
      <div class="topbalk-links">
        <img src="assets/duust-logo.webp" alt="8-duust">
        <div>
          <div class="topbalk-titel">Beheer</div>
          <div class="topbalk-sub">Reservaties privéfeesten</div>
        </div>
      </div>
      <div class="beheer-balk">
        <span id="ingelogd-als"></span>
        <button type="button" id="uitlog-knop">Uitloggen</button>
      </div>
    </header>

    <div class="pagina pagina-breed">
      <div id="fout-banner" class="banner banner-fout verborgen"></div>

      <div id="portaal-inhoud">
        <div class="statistieken">
          <div class="kaart stat">
            <div class="stat-label" id="stat-feesten-label">Feesten deze maand</div>
            <div class="stat-waarde" id="stat-feesten">–</div>
          </div>
          <div class="kaart stat">
            <div class="stat-label" id="stat-ontvangen-label">Ontvangen deze maand</div>
            <div class="stat-waarde" id="stat-ontvangen">–</div>
          </div>
          <div class="kaart stat">
            <div class="stat-label" id="stat-volgend-label">Volgend feest</div>
            <div class="stat-volgend" id="stat-volgend">–</div>
          </div>
        </div>

        <div class="beheer-indeling">
          <section class="kaart kalender-sectie">
            <div class="kalender-kop">
              <button id="vorige-maand" type="button" aria-label="Vorige maand">‹</button>
              <h2 id="maand-titel"></h2>
              <button id="volgende-maand" type="button" aria-label="Volgende maand">›</button>
            </div>

            <div class="weekdagen">
              <div>ma</div><div>di</div><div>wo</div><div>do</div><div>vr</div><div>za</div><div>zo</div>
            </div>
            <div id="kalender" class="kalender"></div>

            <div class="legenda">
              <span><span class="legenda-blok bezet"></span> Bezet — klik voor details</span>
              <span><span class="legenda-blok niet-beschikbaar"></span> Vrij</span>
            </div>
          </section>

          <section id="detail-paneel" class="kaart verborgen" aria-live="polite">
            <div class="detail-kop">
              <h2 id="detail-titel"></h2>
              <span class="pil-status">Betaald</span>
            </div>
            <p id="detail-subtitel" class="detail-subtitel"></p>
            <div id="detail-lijst" class="detail-lijst"></div>
            <div id="detail-prijs" class="prijs-blok"></div>
            <div id="detail-voet" class="detail-voet"></div>
            <div class="detail-acties">
              <a id="detail-bellen" class="actie-bellen" href="#">Bellen</a>
              <a id="detail-mailen" class="actie-mailen" href="#">E-mailen</a>
            </div>
          </section>
        </div>

        <section class="kaart komende-sectie">
          <div class="komende-kop">
            <h2>Komende reservaties</h2>
            <select id="komende-filter" aria-label="Filter op maand"></select>
          </div>
          <div id="komende-lijst" class="komende-lijst"></div>
          <p id="komende-leeg" class="verborgen">Er zijn geen komende reservaties.</p>
        </section>
      </div>
    </div>
  </section>

  <!-- Zelf-gehoste kopie van @supabase/supabase-js (vaste versie) in plaats
       van een externe CDN: zo kan een gecompromitteerde CDN nooit code op
       deze pagina uitvoeren. Nieuwe versie? Zie README ("Bibliotheek bijwerken"). -->
  <script src="assets/supabase-js-2.110.3.min.js"></script>
  <script type="module" src="beheer.js"></script>
</body>
</html>
